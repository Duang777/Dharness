[mypy]
# pyproject.toml is hash-frozen by the TB2.1 protocol, so the narrow test
# override below lives in this separate configuration file.
python_version = 3.12
check_untyped_defs = True

[mypy-harbor.*]
ignore_missing_imports = True

[mypy-mutation.test_tb21_sensitivity_protocol]
